        function renderSchedule() {
            let html = '<div class="flex items-center gap-2 text-2xl font-extrabold text-[#1B2D5B] mb-3"><span class="text-2xl">🗓️</span>每日行程</div>';
            tripData.schedule.forEach(day => {
                html += `<div class="day-card bg-white rounded-2xl p-4 mb-3 shadow-sm border border-[#F0E0D0]">`;
                html += `<div class="font-bold text-[#1B2D5B] text-lg flex items-center gap-2">📅 ${day.day}｜${day.date}</div>`;
                html += `<div class="text-xs text-gray-500 mb-2">${day.title}</div>`;

                html += '<ul class="timeline list-none">';
                day.items.forEach(item => {
                    html += `<li class="py-2 flex gap-2 text-sm items-start"><span class="font-bold text-red-700 min-w-[52px] shrink-0 text-xs text-center bg-red-50 px-2 py-0.5 rounded-full">${item.time}</span><span class="flex-1 text-sm">${item.desc}</span></li>`;
                });
                html += '</ul>';

                if (day.kkday) {
                    html += `<div class="bg-sky-50 rounded-xl p-3 my-2 border border-sky-200"><h5 class="text-[#1565C0] mb-1.5 text-sm font-bold">${day.kkday.title}</h5>`;
                    day.kkday.stops.forEach(stop => {
                        html += `<div class="text-xs py-1 border-b border-dotted border-sky-200 last:border-0">${stop}</div>`;
                    });
                    html += '</div>';
                }

                if (day.itemsAfter) {
                    html += '<ul class="timeline list-none">';
                    day.itemsAfter.forEach(item => {
                        html += `<li class="py-2 flex gap-2 text-sm items-start"><span class="font-bold text-red-700 min-w-[52px] shrink-0 text-xs text-center bg-red-50 px-2 py-0.5 rounded-full">${item.time}</span><span class="flex-1 text-sm">${item.desc}</span></li>`;
                    });
                    html += '</ul>';
                }

                if (day.highlight) {
                    html += `<div class="bg-gradient-to-br from-gray-50 to-amber-50 rounded-xl p-3 my-2 border border-gray-200"><h4 class="text-[#5B7A8C] mb-1 text-sm font-bold">${day.highlight.title}</h4><p class="text-xs text-gray-600">${day.highlight.content}</p></div>`;
                }

                if (day.links) {
                    html += '<div class="flex flex-wrap gap-1.5 mt-2">';
                    day.links.forEach(link => {
                        const icon = link.cls.includes('red-') ? '▶️ ' : '';
                        html += `<a href="${link.url}" class="btn inline-flex items-center gap-1 px-4 py-2 rounded-full text-sm font-semibold no-underline transition-all duration-200 ${link.cls}" target="_blank">${icon}${link.label}</a>`;
                    });
                    html += '</div>';
                }

                html += '</div>';
            });
            return html;
        }

        function renderSuica() {
            const s = tripData.suica;
            let html = '<div class="flex items-center gap-2 text-2xl font-extrabold text-[#1B2D5B] mb-3"><span class="text-2xl">💳</span>西瓜卡車資總表</div>';
            html += `<div class="text-xs text-gray-500 bg-gray-50 px-3 py-2 rounded-lg inline-block mb-3">📌 匯率：${s.rate}</div>`;
            html += '<div class="bg-white rounded-2xl overflow-hidden shadow-sm border border-[#F0E0D0]"><table class="w-full text-xs border-collapse"><thead><tr class="bg-[#1B2D5B] text-white"><th class="p-2 text-left text-[11px]">日期</th><th class="p-2 text-left text-[11px]">路線</th><th class="p-2 text-left text-[11px]">單人（¥）</th><th class="p-2 text-left text-[11px]">四人（¥）</th><th class="p-2 text-left text-[11px]">單人（NT$）</th><th class="p-2 text-left text-[11px]">四人（NT$）</th></tr></thead><tbody>';

            const dayTotals = {};
            s.rows.forEach(row => {
                if (!dayTotals[row.day]) {
                    dayTotals[row.day] = { single: 0, four: 0 };
                }
                dayTotals[row.day].single += parseInt(row.single.replace('¥', ''));
                dayTotals[row.day].four += parseInt(row.four.replace('¥', ''));
            });

            let currentDay = '';
            s.rows.forEach(row => {
                if (currentDay && currentDay !== row.day) {
                    const total = dayTotals[currentDay];
                    const twdSingle = Math.round(total.single * 0.225);
                    const twdFour = Math.round(total.four * 0.225);
                    html += `<tr class="bg-gray-50 font-semibold"><td colspan="2" class="p-2">${currentDay} 小計</td><td class="p-2">¥${total.single}</td><td class="p-2">¥${total.four}</td><td class="p-2">約$${twdSingle}</td><td class="p-2">約$${twdFour}</td></tr>`;
                }
                currentDay = row.day;
                html += `<tr><td class="p-2 border-b border-gray-100">${row.day}</td><td class="p-2 border-b border-gray-100">${row.route}</td><td class="p-2 border-b border-gray-100">${row.single}</td><td class="p-2 border-b border-gray-100">${row.four}</td><td class="p-2 border-b border-gray-100">${row.single_twd}</td><td class="p-2 border-b border-gray-100">${row.four_twd}</td></tr>`;
            });

            if (currentDay) {
                const total = dayTotals[currentDay];
                const twdSingle = Math.round(total.single * 0.225);
                const twdFour = Math.round(total.four * 0.225);
                html += `<tr class="bg-gray-50 font-semibold"><td colspan="2" class="p-2">${currentDay} 小計</td><td class="p-2">¥${total.single}</td><td class="p-2">¥${total.four}</td><td class="p-2">約$${twdSingle}</td><td class="p-2">約$${twdFour}</td></tr>`;
            }

            html += `<tr class="font-bold bg-[#FFF8F0]"><td colspan="2" class="p-2">總計（6天）</td><td class="p-2">${s.total.single}</td><td class="p-2">${s.total.four}</td><td class="p-2">${s.total.single_twd}</td><td class="p-2">${s.total.four_twd}</td></tr>`;
            html += '</tbody></table></div>';

            html += `<div class="bg-gradient-to-br from-gray-50 to-amber-50 rounded-xl p-3 mt-3 border border-gray-200"><h4 class="text-[#5B7A8C] mb-1.5 text-sm font-bold">👥 每人與四人總覽</h4>`;
            html += '<table class="w-full text-sm border-collapse">';
            s.summary.forEach(item => {
                html += `<tr><td class="py-1 font-semibold">${item.label}</td><td class="py-1 text-right">${item.value}</td></tr>`;
            });
            html += '</table></div>';

            html += `<div class="bg-gradient-to-br from-gray-50 to-amber-50 rounded-xl p-3 mt-3 border border-gray-200"><h4 class="text-[#5B7A8C] mb-1 text-sm font-bold">📌 補充說明</h4><p class="text-xs text-gray-600">${s.note}</p></div>`;
            return html;
        }

        ];

        tabs.forEach((tab, index) => {
            const div = document.createElement('div');
            div.id = `tab-${tab.id}`;
            div.className = `tab-content${index === 0 ? ' active' : ''}`;
            div.innerHTML = tab.render();
            app.appendChild(div);
        });

        const nav = document.getElementById('bottomNav');
        tabs.forEach((tab, index) => {
            const btn = document.createElement('button');
            btn.className = `nav-item flex-1 flex flex-col items-center justify-center text-[10px] text-gray-400 cursor-pointer gap-0.5 border-none bg-transparent transition-all duration-200${index === 0 ? ' active' : ''}`;
            btn.innerHTML = `<span class="nav-icon text-xl transition-all duration-200">${tab.icon}</span>${tab.label}`;
            btn.onclick = () => switchTab(tab.id);
            nav.appendChild(btn);
        });

        // ============================================================
        // 🔧 功能函式
        // ============================================================

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.getElementById('tab-' + tabName).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            const tabIndex = tabs.findIndex(t => t.id === tabName);
            if (tabIndex >= 0) document.querySelectorAll('.nav-item')[tabIndex].classList.add('active');
            window.scrollTo(0, 0);
        }

        function toggleCheck(element) {
            element.classList.toggle('checked');
            saveChecklistState();
        }

        function saveChecklistState() {
            const allLists = document.querySelectorAll('.checklist');
            const state = {};
            allLists.forEach((list, listIndex) => {
                const items = list.querySelectorAll('li');
                const checkedItems = [];
                items.forEach((item, itemIndex) => {
                    if (item.classList.contains('checked')) checkedItems.push(itemIndex);
                });
                state['list-' + listIndex] = checkedItems;
            });
            localStorage.setItem('osaka-checklist', JSON.stringify(state));
        }

        function loadChecklistState() {
            const saved = localStorage.getItem('osaka-checklist');
            if (!saved) return;
            const state = JSON.parse(saved);
            const allLists = document.querySelectorAll('.checklist');
            allLists.forEach((list, listIndex) => {
                const checkedItems = state['list-' + listIndex] || [];
                const items = list.querySelectorAll('li');
                checkedItems.forEach(itemIndex => {
                    if (items[itemIndex]) items[itemIndex].classList.add('checked');
                });
            });
        }

        document.addEventListener('DOMContentLoaded', loadChecklistState);
    </script>
</body>
</html>
